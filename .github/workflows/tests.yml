name: Tests

on:
  push:
    branches: [ main, refactor, develop ]
  pull_request:
    branches: [ main, refactor, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge

    - name: Display environment info
      shell: bash -l {0}
      run: |
        conda info
        conda list
        python --version

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        conda env create -f environment.yaml
        conda activate multilogger-env
        conda list

    - name: Lint with ruff (optional, for future)
      shell: bash -l {0}
      continue-on-error: true
      run: |
        conda activate multilogger-env
        # Uncomment when linting is set up
        # conda install ruff
        # ruff check src/

    - name: Run tests with pytest
      shell: bash -l {0}
      run: |
        conda activate multilogger-env
        pytest -v --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage HTML
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      with:
        name: coverage-html
        path: htmlcov/

    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .coverage
          coverage.xml

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.11'
        channels: conda-forge

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        conda env create -f environment.yaml
        conda activate multilogger-env

    - name: Run tests
      shell: bash -l {0}
      run: |
        conda activate multilogger-env
        pytest -v --cov=src --cov-report=term-missing

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.11'
        channels: conda-forge

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        conda env create -f environment.yaml
        conda activate multilogger-env

    - name: Run tests
      shell: bash -l {0}
      run: |
        conda activate multilogger-env
        pytest -v --cov=src --cov-report=term-missing
