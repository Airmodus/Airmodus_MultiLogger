name: multilogger-env
channels:
  - conda-forge
dependencies:
  - numpy
  - pyinstaller
  - pyqt
  - pyqtgraph=0.13.3
  - pyserial
  - pyopengl>=3.1.7
  - numpy-stl>=3.0.0
  - psycopg2
  # Testing dependencies
  - pytest>=7.0
  - pytest-qt>=4.2
  - pytest-mock>=3.10
  - pytest-cov>=4.0
  - pytest-timeout>=2.1
